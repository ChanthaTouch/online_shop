<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cupGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6F47;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coffeeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6F4E37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E2723;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#FFF8E7"/>
  
  <!-- Coffee cup body -->
  <path d="M 35 50 L 40 95 Q 40 100 45 100 L 83 100 Q 88 100 88 95 L 93 50 Z" 
        fill="url(#cupGradient)" stroke="#5D4037" stroke-width="2.5"/>
  
  <!-- Coffee liquid surface -->
  <ellipse cx="64" cy="50" rx="29" ry="6" fill="url(#coffeeGradient)"/>
  
  <!-- Cup rim highlight -->
  <ellipse cx="64" cy="48" rx="29" ry="3" fill="#F5DEB3" opacity="0.4"/>
  
  <!-- Handle -->
  <path d="M 93 58 Q 105 58 105 70 Q 105 82 93 82" 
        fill="none" stroke="#D4A574" stroke-width="4" stroke-linecap="round"/>
  <path d="M 93 58 Q 105 58 105 70 Q 105 82 93 82" 
        fill="none" stroke="#8B6F47" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Steam wisps -->
  <g opacity="0.6">
    <path d="M 50 40 Q 48 32 50 24 Q 52 16 50 8" 
          fill="none" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 64 42 Q 62 34 64 26 Q 66 18 64 10" 
          fill="none" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 78 40 Q 80 32 78 24 Q 76 16 78 8" 
          fill="none" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Coffee bean accent (optional) -->
  <ellipse cx="64" cy="52" rx="4" ry="6" fill="#3E2723" opacity="0.3" transform="rotate(-20 64 52)"/>
</svg>
